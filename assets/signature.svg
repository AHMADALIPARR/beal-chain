<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a6fa5"/>
    </marker>
  </defs>
  <rect width="760" height="340" fill="#ffffff"/>
  <text x="380" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">Signature partition: step2_signature_partition</text>
  <g font-size="12" fill="#1f2937">
    <rect x="280" y="48" width="200" height="48" rx="8" fill="#eef2f7" stroke="#4a6fa5" stroke-width="1.5"/>
    <text x="380" y="68" text-anchor="middle" font-weight="bold">Reduced triple (p, q, r)</text>
    <text x="380" y="86" text-anchor="middle">each &#8805; 3, prime or 4</text>
    <rect x="40" y="160" width="150" height="72" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="115" y="182" text-anchor="middle" font-weight="bold">flt</text>
    <text x="115" y="200" text-anchor="middle">p = q = r</text>
    <text x="115" y="218" text-anchor="middle">Fermat</text>
    <rect x="220" y="160" width="150" height="72" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="295" y="182" text-anchor="middle" font-weight="bold">darmon</text>
    <text x="295" y="200" text-anchor="middle">p = q, r = 3 or 4</text>
    <text x="295" y="218" text-anchor="middle">Darmon&#8211;Merel</text>
    <rect x="400" y="160" width="150" height="72" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="475" y="182" text-anchor="middle" font-weight="bold">kraus</text>
    <text x="475" y="200" text-anchor="middle">p = 3, q = 3</text>
    <text x="475" y="218" text-anchor="middle">Kraus</text>
    <rect x="580" y="160" width="150" height="72" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
    <text x="655" y="182" text-anchor="middle" font-weight="bold">open hyperbolic</text>
    <text x="655" y="200" text-anchor="middle">1/p + 1/q + 1/r &lt; 1</text>
    <text x="655" y="218" text-anchor="middle">Darmon program</text>
  </g>
  <g stroke="#4a6fa5" stroke-width="1.5" fill="none">
    <line x1="330" y1="96" x2="150" y2="158" marker-end="url(#arrow2)"/>
    <line x1="360" y1="96" x2="290" y2="158" marker-end="url(#arrow2)"/>
    <line x1="400" y1="96" x2="470" y2="158" marker-end="url(#arrow2)"/>
    <line x1="430" y1="96" x2="620" y2="158" marker-end="url(#arrow2)"/>
  </g>
  <text x="380" y="270" text-anchor="middle" font-size="12" fill="#4b5563">Known signatures dispatch to KnownSignatureTheorems.</text>
  <text x="380" y="290" text-anchor="middle" font-size="12" fill="#4b5563">The open branch is conditional on GeneralDarmonProgramData.</text>
  <text x="380" y="320" text-anchor="middle" font-size="12" fill="#4b5563">Example open triple: (5, 7, 3) &#8212; 1/5 + 1/7 + 1/3 &lt; 1.</text>
</svg>
