<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="300" fill="#ffffff"/>
  <text x="320" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">Weight-2 Sturm bounds for &#915;&#8320;(N)</text>
  <text x="320" y="44" text-anchor="middle" font-size="12" fill="#4b5563">sturm_bound_weight2 N = &#8970;(N &#183; &#8719;_{p|N} (1 + 1/p)) / 6&#8971;</text>
  <g font-size="12" fill="#1f2937">
    <line x1="80" y1="250" x2="580" y2="250" stroke="#374151" stroke-width="1.5"/>
    <line x1="80" y1="250" x2="80" y2="70" stroke="#374151" stroke-width="1.5"/>
    <text x="70" y="254" text-anchor="end">0</text>
    <text x="70" y="204" text-anchor="end">4</text>
    <text x="70" y="154" text-anchor="end">8</text>
    <text x="70" y="104" text-anchor="end">12</text>
    <text x="70" y="54" text-anchor="end">16</text>
    <rect x="140" y="175" width="90" height="75" fill="#4a6fa5"/>
    <text x="185" y="165" text-anchor="middle" font-weight="bold">6</text>
    <text x="185" y="270" text-anchor="middle">N = 27</text>
    <rect x="290" y="150" width="90" height="100" fill="#4a6fa5"/>
    <text x="335" y="140" text-anchor="middle" font-weight="bold">8</text>
    <text x="335" y="270" text-anchor="middle">N = 32</text>
    <rect x="440" y="50" width="90" height="200" fill="#2e7d32"/>
    <text x="485" y="40" text-anchor="middle" font-weight="bold">16</text>
    <text x="485" y="270" text-anchor="middle">N = 64</text>
  </g>
  <text x="320" y="292" text-anchor="middle" font-size="11" fill="#4b5563">Verified by sturm_bound_level_27, sturm_bound_level_32, sturm_bound_level_64 (exact rational arithmetic).</text>
</svg>
