<svg xmlns="http://www.w3.org/2000/svg" width="960" height="220" viewBox="0 0 960 220" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a6fa5"/>
    </marker>
  </defs>
  <rect width="960" height="220" fill="#ffffff"/>
  <text x="480" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">BealChain proof pipeline</text>
  <g font-size="12" fill="#1f2937">
    <rect x="20" y="60" width="160" height="90" rx="8" fill="#eef2f7" stroke="#4a6fa5" stroke-width="1.5"/>
    <text x="100" y="82" text-anchor="middle" font-weight="bold">Input</text>
    <text x="100" y="102" text-anchor="middle">A^x + B^y = C^z</text>
    <text x="100" y="120" text-anchor="middle">x, y, z &gt; 2</text>
    <text x="100" y="138" text-anchor="middle">pairwise coprime</text>
    <rect x="210" y="60" width="160" height="90" rx="8" fill="#eef2f7" stroke="#4a6fa5" stroke-width="1.5"/>
    <text x="290" y="82" text-anchor="middle" font-weight="bold">Step 1</text>
    <text x="290" y="102" text-anchor="middle">Exponent reduction</text>
    <text x="290" y="120" text-anchor="middle">{ prime &#8805; 3 } &#8746; { 4 }</text>
    <text x="290" y="138" text-anchor="middle">coprimality kept</text>
    <rect x="400" y="60" width="160" height="90" rx="8" fill="#eef2f7" stroke="#4a6fa5" stroke-width="1.5"/>
    <text x="480" y="82" text-anchor="middle" font-weight="bold">Step 2</text>
    <text x="480" y="102" text-anchor="middle">Signature partition</text>
    <text x="480" y="120" text-anchor="middle">known or open</text>
    <text x="480" y="138" text-anchor="middle">hyperbolic</text>
    <rect x="590" y="60" width="160" height="90" rx="8" fill="#eef2f7" stroke="#4a6fa5" stroke-width="1.5"/>
    <text x="670" y="82" text-anchor="middle" font-weight="bold">Step 3</text>
    <text x="670" y="102" text-anchor="middle">Frey curve</text>
    <text x="670" y="120" text-anchor="middle">conductor, nonzero</text>
    <text x="670" y="138" text-anchor="middle">discriminant</text>
    <rect x="780" y="60" width="160" height="90" rx="8" fill="#eef2f7" stroke="#4a6fa5" stroke-width="1.5"/>
    <text x="860" y="82" text-anchor="middle" font-weight="bold">Sturm bounds</text>
    <text x="860" y="102" text-anchor="middle">27 &#8594; 6</text>
    <text x="860" y="120" text-anchor="middle">32 &#8594; 8</text>
    <text x="860" y="138" text-anchor="middle">64 &#8594; 16</text>
  </g>
  <g stroke="#4a6fa5" stroke-width="1.5" fill="none">
    <line x1="180" y1="105" x2="208" y2="105" marker-end="url(#arrow)"/>
    <line x1="370" y1="105" x2="398" y2="105" marker-end="url(#arrow)"/>
    <line x1="560" y1="105" x2="588" y2="105" marker-end="url(#arrow)"/>
    <line x1="750" y1="105" x2="778" y2="105" marker-end="url(#arrow)"/>
  </g>
  <text x="480" y="190" text-anchor="middle" font-size="12" fill="#4b5563">Deep results (FLT, Darmon&#8211;Merel, Kraus, Darmon program) stay inside hypothesis structures; no unconditional proof of Beal is claimed.</text>
</svg>
